name: DavLauncher
options:
  createIntermediateGroups: true
  developmentLanguage: en
  useBaseInternationalization: false
  deploymentTarget:
    iOS: '27.0'
  xcodeVersion: '27.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    APP_BUNDLE_ID: com.dav.DavLauncher
    APP_GROUP_ID: group.com.dav.DavLauncher
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 1.1.0
    IPHONEOS_DEPLOYMENT_TARGET: '27.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    SUPPORTS_MACCATALYST: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  DavLauncher:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/App
      - path: Resources/Localization
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: DavLauncherWidgets
        embed: true
      - target: DavLauncherSefariaPreview
        embed: true
      - target: DavLauncherShareCompact
        embed: true
      - target: DavLauncherShareMedium
        embed: true
      - target: DavLauncherShareExpanded
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: DavLauncher
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/DavLauncher.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        OTHER_LDFLAGS: $(inherited)

  DavLauncherWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/Widgets
      - path: Resources/Localization
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).Widgets
        PRODUCT_NAME: DavLauncherWidgets
        INFOPLIST_FILE: Config/Widgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/DavLauncherWidgets.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_PREVIEWS: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

  DavLauncherSefariaPreview:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Shared/Configuration/AppEnvironment.swift
      - path: Sources/Shared/Services/DiagnosticLog.swift
      - path: Sources/Shared/Services/SpotlightItemLab.swift
      - path: Sources/Shared/Services/SpotlightSefariaLab.swift
      - path: Sources/QuickLookPreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).SefariaPreview
        PRODUCT_NAME: DavLauncherSefariaPreview
        PRODUCT_MODULE_NAME: DavLauncherSefariaPreview
        INFOPLIST_FILE: Config/SefariaPreview-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/DavLauncherSefariaPreview.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_PREVIEWS: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

  DavLauncherShareCompact:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Shared/Configuration/AppEnvironment.swift
      - path: Sources/Shared/Services/DiagnosticLog.swift
      - path: Sources/ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).ShareCompact
        PRODUCT_NAME: DavLauncherShareCompact
        PRODUCT_MODULE_NAME: DavLauncherShareCompact
        INFOPLIST_FILE: Config/ShareLab-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/DavLauncherShare.entitlements
        SHARE_DISPLAY_NAME: Dav Compact
        SHARE_LAB_MODE: compact
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

  DavLauncherShareMedium:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Shared/Configuration/AppEnvironment.swift
      - path: Sources/Shared/Services/DiagnosticLog.swift
      - path: Sources/ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).ShareMedium
        PRODUCT_NAME: DavLauncherShareMedium
        PRODUCT_MODULE_NAME: DavLauncherShareMedium
        INFOPLIST_FILE: Config/ShareLab-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/DavLauncherShare.entitlements
        SHARE_DISPLAY_NAME: Dav Medium
        SHARE_LAB_MODE: medium
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

  DavLauncherShareExpanded:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Shared/Configuration/AppEnvironment.swift
      - path: Sources/Shared/Services/DiagnosticLog.swift
      - path: Sources/ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).ShareExpanded
        PRODUCT_NAME: DavLauncherShareExpanded
        PRODUCT_MODULE_NAME: DavLauncherShareExpanded
        INFOPLIST_FILE: Config/ShareLab-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/DavLauncherShare.entitlements
        SHARE_DISPLAY_NAME: Dav Expanded
        SHARE_LAB_MODE: expanded
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

  DavLauncherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/DavLauncherTests
    dependencies:
      - target: DavLauncher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).Tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DavLauncher.app/DavLauncher
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  DavLauncher:
    build:
      targets:
        DavLauncher: all
        DavLauncherWidgets: all
        DavLauncherSefariaPreview: all
        DavLauncherShareCompact: all
        DavLauncherShareMedium: all
        DavLauncherShareExpanded: all
        DavLauncherTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: DavLauncherTests
    run:
      config: Debug
    archive:
      config: Release
