name: Package unsigned IPA

# Fast iteration path: device Release build, required extension verification,
# ad-hoc entitlement signing and SideStore-ready IPA. No simulator, no tests.
# The full 'iOS 27 CI' workflow remains unchanged for comprehensive checks.
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: App bundle identifier
        required: false
        default: com.dav.DavLauncher
      app_group_id:
        description: App Group identifier
        required: false
        default: group.com.dav.DavLauncher
  push:
    branches:
      - experiment/shortcuts-share-extension-invocation
    paths:
      - 'Sources/App/Intents/TranslationSnippetExperimentIntent.swift'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Fast device build and IPA
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      APP_BUNDLE_ID: ${{ inputs.bundle_id || 'com.dav.DavLauncher' }}
      APP_GROUP_ID: ${{ inputs.app_group_id || 'group.com.dav.DavLauncher' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This script already runs bootstrap.sh (XcodeGen), builds a generic
      # iOS Release app, verifies required assets/extension bundle IDs,
      # ad-hoc signs the app and widget entitlements and packages the IPA.
      # Repeating bootstrap or building an iPad simulator adds no value here.
      - name: Build and package SideStore-ready IPA
        run: ./scripts/build_unsigned_ipa.sh

      - name: Collect diagnostics if build failed
        if: failure()
        continue-on-error: true
        run: ./scripts/collect_diagnostics.sh

      - name: Upload IPA and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DavLauncher-IPA-${{ github.run_number }}
          path: Artifacts/
          if-no-files-found: warn
          retention-days: 30
